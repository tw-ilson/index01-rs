[package]
name = "index01"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Talk to the Pebble/Core Devices Index 01 ring over BLE: pull voice collections and decode them to WAV."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "index01"
path = "src/main.rs"

[dependencies]
btleplug = "0.13.5"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
uuid = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
